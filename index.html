<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Redirect to the public folder while preserving query parameters and hash fragments
        // Supabase often appends auth tokens to the URL hash (e.g., #access_token=...)
        window.location.replace("public/" + window.location.search + window.location.hash);
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="public/">click here</a>.</p>
</body>
</html>
