<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PGSO</title>
    <link rel="icon" type="image/png" href="../pgso.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="admin-login.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#1C1F2D] to-blue-900 text-gray-800 min-h-screen flex items-center justify-center relative justify-items-center">

    <!-- Premium Back Button -->
    <a href="../index.html" class="absolute top-6 left-6 md:top-10 md:left-10 bg-white/10 backdrop-blur-md border border-white/20 text-white px-5 py-2.5 rounded-xl text-sm font-bold tracking-wide hover:bg-white/20 transition-all shadow-lg flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Customer Portal
    </a>

    <div class="bg-white w-full max-w-md p-10 md:p-12 rounded-[2rem] shadow-2xl relative border-t-8 border-blue-700 overflow-visible mt-12 md:mt-0">
        
        <!-- Overlapping Top Icon -->
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-white z-10">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-700 to-blue-800 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
            </div>
        </div>

        <div class="text-center mb-10 mt-6">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2 tracking-tight">Admin Portal</h1>
            <p class="text-slate-500 font-medium text-sm">Sign in to manage reservations</p>
        </div>

        <form id="login-form">
            <div class="mb-5">
                <label for="email" class="block text-[11px] font-bold uppercase tracking-widest mb-2 text-slate-500">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-slate-400"></i>
                    </div>
                    <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-100 transition-all" placeholder="admin@benguet.gov.ph" required>
                </div>
            </div>

            <div class="mb-8">
                <label for="password" class="block text-[11px] font-bold uppercase tracking-widest mb-2 text-slate-500">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400"></i>
                    </div>
                    <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-100 transition-all" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                Secure Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
            
            <!-- Error Banner -->
            <div id="error-msg" class="hidden mt-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-center flex items-center justify-center gap-2 text-sm font-bold">
            </div>
            
        </form>
    </div>

    <script type="module" src="admin-login.js"></script>
</body>
</html>
